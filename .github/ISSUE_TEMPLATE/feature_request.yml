name: 功能请求
description: 建议新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的功能建议！请详细描述你想要的功能。

  - type: textarea
    id: problem
    attributes:
      label: 遇到的问题
      description: 这个功能是为了解决什么问题？
      placeholder: 例如：我经常需要快速切换壁纸，但目前操作太繁琐
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你希望怎么实现这个功能？
      placeholder: 例如：在托盘菜单里添加"切换壁纸"选项
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过其他实现方式吗？
      placeholder: 例如：也可以用快捷键切换

  - type: textarea
    id: additional
    attributes:
      label: 其他信息
      description: 截图、参考链接、相关讨论等
